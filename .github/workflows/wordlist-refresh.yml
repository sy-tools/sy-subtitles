name: Wordlist Refresh

# site/dict/words_uk.txt is one sorted file generated from every talk and the
# glossary. Rebuilding it inside each talk's own PR made parallel pipeline runs
# conflict on it (their new words land on neighbouring lines), so it is rebuilt
# here instead, from main, after those talks have landed.
# Why: tests/test_pipeline_wordlist_refresh.py
on:
  push:
    branches: [main]
    # Never site/: this workflow's own PR merging must not wake it again.
    paths:
      - 'talks/*/transcript_uk.txt'
      - 'talks/*/*/final/uk.srt'
      - 'glossary/**'
  # A merge made with GITHUB_TOKEN (the bot App not configured) starts no push run.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The App key is a secret of the `main` environment, which admits only the
    # main branch, so a workflow pushed on another branch cannot read it.
    environment: main
    env:
      BOT_APP_READY: ${{ vars.BOT_APP_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
    # GitHub keeps one running and one pending run per group, replacing the
    # pending one with each newer push: a burst of talk merges ends in a single
    # refresh built from the last of them. The running one is not cancelled —
    # it may already have opened its PR, and a second PR built beside it would
    # conflict with it on this very file.
    concurrency:
      group: wordlist-refresh
      cancel-in-progress: false
    steps:
      # Why an App token, and why before the checkout: tests/test_bot_pr_app_token.py
      - name: Mint bot App token
        id: bot-token
        if: env.BOT_APP_READY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Warn that the bot PR will wait for approval
        if: steps.bot-token.outputs.token == ''
        run: echo "::warning::No bot App token (the App is not configured, or minting failed above), so the bot PR is opened with GITHUB_TOKEN and its CI will wait for a person to approve it"

      # A queued run starts after its predecessor merged; `ref: main` makes it
      # build from that tip, not from the commit that queued it.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Rebuild the typo-hint wordlist
        run: python -m tools.build_wordlist

      # A predecessor whose PR went red or did not merge in time leaves it
      # open; once this one merges, that one can only ever be `dirty`.
      - name: Close superseded wordlist PRs
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
        run: |
          gh pr list --state open --search "head:bot/wordlist" --json number --jq '.[].number' |
            while read -r pr; do
              gh pr close "$pr" --delete-branch --comment "Superseded by a newer wordlist refresh."
            done

      # bot-pr.sh exits quietly when the rebuilt list is unchanged.
      - name: Commit via PR
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          BOT_PR_WAIT_MERGE_SECONDS: ${{ steps.bot-token.outputs.token != '' && '600' || '' }}
        run: .github/scripts/bot-pr.sh bot/wordlist "Refresh typo-hint wordlist" site/dict/words_uk.txt
