name: Sync Review Status

on:
  issues:
    types: [labeled, unlabeled, assigned, unassigned, closed, reopened]
  workflow_dispatch:
  workflow_call:

# contents: write is for the push to the data branch; the repository default
# is read-only, so every workflow that calls this one must grant it too.
permissions:
  contents: write
  issues: write

jobs:
  # Label edits need no serialization, and must stay out of the sync queue:
  # GitHub keeps one pending run per concurrency group and cancels the older
  # one, which would drop its label edit while another sync is running.
  labels:
    runs-on: ubuntu-latest
    # Only the translator's `Review:` issues: an `Operator:` issue closing means
    # delivery (talk-operator.yml), never `review:approved`.
    if: >
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'talk-review') && (
        github.event.action == 'assigned' ||
        github.event.action == 'unassigned' ||
        github.event.action == 'closed' ||
        github.event.action == 'reopened'
      )
    steps:
      - name: Auto-update labels on assign/unassign/close/reopen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = "assigned" ]; then
            gh issue edit "$ISSUE" --remove-label "review:pending" --add-label "review:in-progress"
          elif [ "$ACTION" = "unassigned" ]; then
            ASSIGNEES=$(gh issue view "$ISSUE" --json assignees --jq '.assignees | length')
            IN_PROGRESS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | index("review:in-progress") != null')
            if [ "$ASSIGNEES" = "0" ] && [ "$IN_PROGRESS" = "true" ]; then
              gh issue edit "$ISSUE" --remove-label "review:in-progress" --add-label "review:pending"
            fi
          elif [ "$ACTION" = "closed" ]; then
            gh issue edit "$ISSUE" --remove-label "review:pending,review:in-progress" --add-label "review:approved"
          elif [ "$ACTION" = "reopened" ]; then
            gh issue edit "$ISSUE" --remove-label "review:approved" --add-label "review:pending"
          fi

  # The statuses are DERIVED from issue labels: nobody reviews them, so they
  # are pushed straight to the `state` data branch rather than merged into
  # main through a pull request — which cost a `gate` run and a commit in the
  # code history for every label change. The SPA reads them from that branch
  # (site/js/review_status_source.js).
  sync:
    needs: labels
    runs-on: ubuntu-latest
    # Serialize syncs: issue events arrive in bursts (claiming two talks
    # seconds apart), and runs that queue do not spend their attempts on
    # pushes the remote refuses. Correctness does not rest on this — a refused
    # push is regenerated by push-state.sh — so a pending run GitHub cancels
    # in favour of a newer one loses nothing: every run rebuilds every status.
    # Job-level on purpose — workflow-level concurrency is ignored when this
    # file runs via workflow_call. cancel-in-progress stays false: a run cut
    # off mid-push would leave the newer one to start over for no reason.
    concurrency:
      group: review-status-sync
      cancel-in-progress: false
    # For 'unlabeled' the issue's label list reflects the state AFTER removal,
    # so removing the last review:* label would skip the sync — also check the
    # removed label itself (github.event.label.name).
    if: >-
      !cancelled() && (
      github.event_name != 'issues' ||
      contains(join(github.event.issue.labels.*.name, ','), 'review:') ||
      startsWith(github.event.label.name, 'review:') ||
      contains(join(github.event.issue.labels.*.name, ','), 'op:') ||
      startsWith(github.event.label.name, 'op:'))
    steps:
      # The live main tip, not the inherited SHA: main supplies the script and
      # the `talks/` list it checks Operator issues against. Called from
      # subtitle-pipeline.yml the default checkout is the pipeline's dispatch
      # SHA, ~1h stale once the translate/build jobs finish, and a talk added
      # since would have no directory there.
      #
      # The default token on purpose: a push made with GITHUB_TOKEN fires no
      # workflow, and this job needs no other secret.
      - uses: actions/checkout@v7
        with:
          ref: main

      # The generator is handed to push-state.sh rather than run before it: a
      # push the remote refuses is answered by reading the issues again, so
      # what lands is never older than the commit it lands on.
      # --seed is main's own copy of the file: what the first run starts from
      # while the data branch does not exist, so entries no issue covers are
      # carried over.
      - name: Publish review-status.json on the state branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/push-state.sh state "Update review status" \
            sh -c 'python3 .github/scripts/sync-review-status.py --status-file "$STATE_DIR/review-status.json" --seed review-status.json'